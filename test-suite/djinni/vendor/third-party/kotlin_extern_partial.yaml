  generic: true
  hash: '%s.hashCode()'
  writeToParcel: 'out.writeString(%s)'
  readFromParcel: 'in.readString()'
jni:
  translator: '::djinni::String'
  header: '"Marshal.hpp"'
  typename: jstring
  typeSignature: 'Ljava/lang/String;'
  kotlinTranslator: '::djinni::String'
wasm:
  typename: 'std::string'
  translator: '::djinni::String'
  header: '"djinni_wasm.hpp"'
ts:
  typename: 'string'
  module: ''
kotlin:
  jniTypename: 'com.dropbox.djinni.testextern.Partial'
