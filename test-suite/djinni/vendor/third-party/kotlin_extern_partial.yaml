# An extern record with only two of the four Kotlin keys, for the negative test.
---
name: extern_kotlin_partial
typedef: 'record deriving(eq)'
params: []
prefix: ''
cpp:
  typename: 'std::string'
  header: '<string>'
  byValue: true
objc:
  typename: 'NSString'
  header: '<Foundation/Foundation.h>'
  boxed: 'NSString'
  pointer: true
  hash: '(NSUInteger)%s.hash'
objcpp:
  translator: '::djinni::String'
  header: '"DJIMarshal+Private.h"'
